[project]
name = "orchestra"
version = "0.1.0"
description = "Run waves of parallel Claude Code workers in Herdr panes"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "scipy>=1.14"]

[project.scripts]
orchestra = "orchestra.cli:main"
matchstats = "matchstats.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestra", "src/matchstats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = ["pytest>=8"]
