name: nightly-data

on:
  schedule:
    # 02:00 UTC: about 04:00 Europe/Madrid in summer, 03:00 in winter.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Restore raw CSV cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build data
        run: uv run matchstats build --out site/public/data --cache data/raw

      - name: Commit and push data
        run: |
          if [ -n "$(git status --porcelain site/public/data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/public/data
            git commit -m "chore(data): nightly update"
            git push
          fi
